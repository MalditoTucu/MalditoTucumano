<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MalditoTucu</title>
<link rel="icon" type="image/png" href="favicon.png">
<style>
  :root {
    --glass-bg: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.18);
    --text-color: #f5f5f5;
    --accent: #ffffff;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    width: 100%;
    overflow-x: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text-color);
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Video de fondo */
  .bg-video {
    position: fixed;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    transform: translate(-50%, -50%);
    z-index: -2;
    object-fit: cover;
  }

  .bg-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.55);
    z-index: -1;
  }

  /* Card glassmorphism */
  .card {
    width: 90%;
    max-width: 420px;
    padding: 44px 32px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fadeIn 2.2s ease;
    position: relative;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    background: rgba(255, 255, 255, 0.1);
    pointer-events: auto;
    cursor: pointer;
  }

  /* Protección básica de imágenes contra descarga/copia */
  img {
    -webkit-user-select: none;
    -moz-user-select: none;
    user-select: none;
    -webkit-user-drag: none;
    -khtml-user-drag: none;
    -moz-user-drag: none;
    -o-user-drag: none;
    user-drag: none;
    -webkit-touch-callout: none;
    pointer-events: none;
  }

  .socials a {
    pointer-events: auto;
  }

  .name {
    margin-top: 18px;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .location {
    margin-top: 6px;
    font-size: 0.9rem;
    opacity: 0.75;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .bio {
    margin-top: 18px;
    font-size: 0.95rem;
    line-height: 1.5;
    min-height: 3.2em;
    opacity: 0.9;
  }

  .bio .cursor-blink {
    display: inline-block;
    width: 2px;
    background: var(--accent);
    margin-left: 2px;
    animation: blink 0.9s steps(1) infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .socials {
    margin-top: 26px;
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .socials a {
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.15);
    text-decoration: none;
    font-size: 1.3rem;
    transition: transform 0.25s ease, background 0.25s ease;
  }

  .socials a:hover {
    transform: translateY(-4px) scale(1.08);
    background: rgba(255, 255, 255, 0.22);
    box-shadow: 0 6px 18px rgba(255, 255, 255, 0.25);
  }

  .socials a img {
    width: 24px;
    height: 24px;
    object-fit: contain;
  }

  .socials a:hover img {
    animation: iconWiggle 0.5s ease;
  }

  @keyframes iconWiggle {
    0% { transform: rotate(0deg) scale(1); }
    25% { transform: rotate(-15deg) scale(1.15); }
    50% { transform: rotate(12deg) scale(1.15); }
    75% { transform: rotate(-6deg) scale(1.1); }
    100% { transform: rotate(0deg) scale(1.1); }
  }

  /* Control de música (mute + volumen) */
  .music-control {
    position: fixed;
    top: 24px;
    left: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 30px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 10;
  }

  .music-toggle {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: transparent;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    color: var(--text-color);
    z-index: 10;
    transition: transform 0.2s ease;
  }

  .music-toggle:hover {
    transform: scale(1.1);
  }

  .volume-wrapper {
    max-width: 0;
    opacity: 0;
    overflow: hidden;
    transition: max-width 0.35s ease, opacity 0.25s ease;
  }

  .volume-wrapper.open {
    max-width: 90px;
    opacity: 1;
  }

  .volume-slider {
    width: 90px;
    accent-color: #ffffff;
    display: block;
  }

  @media (max-width: 480px) {
    .volume-wrapper.open {
      max-width: 60px;
    }

    .volume-slider {
      width: 60px;
    }
  }

  .views-counter {
    position: absolute;
    top: 14px;
    left: 14px;
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 9px;
    background: rgba(255, 255, 255, 0.06);
    border: 1px solid var(--glass-border);
    border-radius: 8px;
    z-index: 2;
    font-size: 0.78rem;
    opacity: 0.55;
  }

  .views-counter img {
    width: 15px;
    height: 15px;
    object-fit: contain;
    opacity: 0.85;
  }

  .watermark {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    text-align: center;
    z-index: 5;
    pointer-events: none;
  }

  .watermark-brand {
    font-size: 13px;
    font-weight: 600;
    color: #3ddc84;
    opacity: 0.55;
  }

  .watermark-msg {
    font-size: 11px;
    font-weight: 400;
    color: #f5f5f5;
    opacity: 0.3;
  }

  /* Easter egg: glitch al hacer 5 clicks seguidos en el avatar */
  @keyframes glitchShake {
    0%   { transform: translate(0, 0); }
    10%  { transform: translate(-9px, 6px); }
    20%  { transform: translate(8px, -7px); }
    30%  { transform: translate(-7px, -8px); }
    40%  { transform: translate(9px, 8px); }
    50%  { transform: translate(-8px, 4px); }
    60%  { transform: translate(8px, -5px); }
    70%  { transform: translate(-5px, 9px); }
    80%  { transform: translate(6px, -8px); }
    90%  { transform: translate(-6px, 5px); }
    100% { transform: translate(0, 0); }
  }

  @keyframes glitchHue {
    0%   { filter: hue-rotate(0deg) saturate(1); }
    25%  { filter: hue-rotate(110deg) saturate(2.2); }
    50%  { filter: hue-rotate(200deg) saturate(1.6); }
    75%  { filter: hue-rotate(300deg) saturate(2.4); }
    100% { filter: hue-rotate(360deg) saturate(1); }
  }

  @keyframes glitchRGB {
    0%, 100% {
      box-shadow: 0 0 0 rgba(255, 0, 70, 0), 0 0 0 rgba(0, 255, 255, 0), 0 8px 32px rgba(0, 0, 0, 0.37);
    }
    20% {
      box-shadow: -7px 0 0 rgba(255, 0, 70, 0.75), 7px 0 0 rgba(0, 255, 255, 0.75), 0 8px 32px rgba(0, 0, 0, 0.37);
    }
    40% {
      box-shadow: 7px 3px 0 rgba(255, 0, 70, 0.75), -7px -3px 0 rgba(0, 255, 255, 0.75), 0 8px 32px rgba(0, 0, 0, 0.37);
    }
    60% {
      box-shadow: -5px -4px 0 rgba(255, 0, 70, 0.75), 5px 4px 0 rgba(0, 255, 255, 0.75), 0 8px 32px rgba(0, 0, 0, 0.37);
    }
    80% {
      box-shadow: 6px -3px 0 rgba(255, 0, 70, 0.75), -6px 3px 0 rgba(0, 255, 255, 0.75), 0 8px 32px rgba(0, 0, 0, 0.37);
    }
  }

  body.glitch-active {
    animation: glitchShake 0.45s linear;
  }

  .card.glitch-active {
    animation: glitchRGB 0.45s linear;
  }

  .avatar.glitch-active {
    animation: glitchHue 0.45s linear;
  }

  .easter-toast {
    position: fixed;
    left: 50%;
    bottom: 0;
    transform: translate(-50%, 120%);
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
    background: rgba(12, 8, 16, 0.88);
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: -4px 0 0 rgba(255, 0, 70, 0.6), 4px 0 0 rgba(0, 255, 255, 0.6), 0 10px 30px rgba(0, 0, 0, 0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 16px 26px;
    border-radius: 16px;
    color: #f5f5f5;
    font-weight: 700;
    font-size: 1.05rem;
    text-align: center;
    max-width: 90%;
    z-index: 50;
    pointer-events: none;
  }

  .easter-toast.show {
    transform: translate(-50%, -24px);
  }

  @media (max-width: 480px) {
    .easter-toast {
      font-size: 0.92rem;
      padding: 14px 20px;
    }
  }

</style>
</head>
<body oncontextmenu="return false;">

  <video class="bg-video" autoplay muted loop playsinline oncontextmenu="return false;">
    <source src="fondo.mp4" type="video/mp4">
  </video>
  <div class="bg-overlay"></div>

  <div class="card">
    <img class="avatar" src="avatar.png" alt="Avatar" draggable="false" onerror="this.style.opacity=0.2;">
    <div class="name">MalditoTucumano</div>
    <div class="location">Tucumán, Argentina</div>
    <div class="bio" id="bio"><span id="bio-text"></span><span class="cursor-blink">&nbsp;</span></div>

    <div class="socials">
      <a href="https://www.instagram.com/brianuvu/" target="_blank" rel="noopener noreferrer" title="@brianuvu"><img src="logos/instagram.png" alt="Instagram" draggable="false"></a>
      <a href="https://www.tiktok.com/@maldito_tucuman0" target="_blank" rel="noopener noreferrer" title="@maldito_tucuman0"><img src="logos/tik-tok.png" alt="TikTok" draggable="false"></a>
      <a href="discord://discordapp.com/users/486374139876081665" target="_blank" rel="noopener noreferrer" title="brians_uvu"><img src="logos/discord.png" alt="Discord" draggable="false"></a>
      <a href="https://kick.com/maldito-tucumano" target="_blank" rel="noopener noreferrer" title="Maldito_Tucumano"><img src="logos/kick.png" alt="Kick" draggable="false"></a>
    </div>

    <div class="views-counter" id="viewsCounter" title="Vistas totales">
      <img src="ojo.png" alt="" draggable="false">
      <span id="viewsCount">--</span>
    </div>
  </div>

  <div class="music-control">
    <button class="music-toggle" id="musicToggle" title="Activar/Desactivar música">🔇</button>
    <div class="volume-wrapper" id="volumeWrapper">
      <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.5">
    </div>
  </div>
  <audio id="bgMusic" src="musica.mp3" loop></audio>

  <div class="watermark">
    <div class="watermark-brand">by MalditoTucumano</div>
    <div class="watermark-msg">si quieres algo como esto escribeme a cualquiera de mis redes y llegamos a un acuerdo</div>
  </div>

  <div class="easter-toast" id="easterToast">Que tanto tocas ahí???????</div>

<script>
  // Efecto de tipeo en la bio
  const bioLines = [
    "Bienvenido, gracias por pasar",
    "Intento de streamer",
    "eh uraaaaa",
    "sigueme en mis redes"
  ];
  const bioText = document.getElementById('bio-text');
  let lineIndex = 0;
  let charIndex = 0;
  let deleting = false;

  function typeLoop() {
    const currentLine = bioLines[lineIndex];

    if (!deleting) {
      bioText.textContent = currentLine.slice(0, charIndex + 1);
      charIndex++;
      if (charIndex === currentLine.length) {
        deleting = true;
        setTimeout(typeLoop, 1800);
        return;
      }
    } else {
      bioText.textContent = currentLine.slice(0, charIndex - 1);
      charIndex--;
      if (charIndex === 0) {
        deleting = false;
        lineIndex = (lineIndex + 1) % bioLines.length;
      }
    }

    setTimeout(typeLoop, deleting ? 35 : 60);
  }
  typeLoop();

  // Música de fondo: toggle de mute + slider de volumen en tiempo real
  const musicToggle = document.getElementById('musicToggle');
  const volumeWrapper = document.getElementById('volumeWrapper');
  const volumeSlider = document.getElementById('volumeSlider');
  const bgMusic = document.getElementById('bgMusic');
  bgMusic.volume = parseFloat(volumeSlider.value);

  function updateMusicIcon() {
    musicToggle.textContent = (bgMusic.paused || bgMusic.muted) ? '🔇' : '🔊';
  }

  // Ciclo de 3 pasos por click: 1) muestra la barra  2) mutea/desmutea  3) cierra la barra
  let volumeStage = 0;

  musicToggle.addEventListener('click', (e) => {
    e.stopPropagation();
    volumeStage = (volumeStage + 1) % 3;

    if (volumeStage === 1) {
      if (bgMusic.paused) {
        bgMusic.muted = false;
        bgMusic.play().catch(() => {});
      }
      volumeWrapper.classList.add('open');
    } else if (volumeStage === 2) {
      bgMusic.muted = !bgMusic.muted;
    } else {
      volumeWrapper.classList.remove('open');
    }

    updateMusicIcon();
  });

  // Cierra la barra de volumen al tocar fuera del control y reinicia el ciclo
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.music-control')) {
      volumeStage = 0;
      volumeWrapper.classList.remove('open');
    }
  });

  volumeSlider.addEventListener('input', () => {
    const vol = parseFloat(volumeSlider.value);
    bgMusic.volume = vol;
    bgMusic.muted = vol === 0;
    if (bgMusic.paused && vol > 0) {
      bgMusic.play().catch(() => {});
    }
    updateMusicIcon();
  });

  // Intento de autoplay al entrar. Si el navegador lo bloquea, arranca
  // apenas el usuario interactúa por primera vez con la página.
  function tryAutoplay() {
    bgMusic.play().then(updateMusicIcon).catch(() => {
      const startOnInteraction = () => {
        bgMusic.play().catch(() => {});
        updateMusicIcon();
      };
      ['click', 'touchstart', 'keydown'].forEach(evt =>
        document.addEventListener(evt, startOnInteraction, { once: true })
      );
    });
  }
  tryAutoplay();

  // Contador de vistas: solo suma una vez por visitante (localStorage),
  // así un refresh no vuelve a incrementar el contador.
  (function () {
    const NAMESPACE = 'malditotucumano-bio';
    const KEY = 'vistas';
    const viewsCountEl = document.getElementById('viewsCount');
    const yaVisito = localStorage.getItem('mt_ya_visito');
    const endpoint = yaVisito
      ? `https://abacus.jasoncameron.dev/get/${NAMESPACE}/${KEY}`
      : `https://abacus.jasoncameron.dev/hit/${NAMESPACE}/${KEY}`;

    fetch(endpoint)
      .then(res => res.json())
      .then(data => {
        if (!yaVisito) localStorage.setItem('mt_ya_visito', '1');
        viewsCountEl.textContent = data.value.toLocaleString('es-AR');
      })
      .catch(() => { viewsCountEl.textContent = '—'; });
  })();

  // Bloqueo de atajos comunes para descargar/inspeccionar imágenes
  document.addEventListener('dragstart', e => {
    if (e.target.tagName === 'IMG') e.preventDefault();
  });

  // Easter egg: 5 clicks seguidos (menos de 1.5s entre cada uno) en el avatar
  (function () {
    const avatarEl = document.querySelector('.avatar');
    const cardEl = document.querySelector('.card');
    const toastEl = document.getElementById('easterToast');
    const bodyEl = document.body;

    const CLICKS_NEEDED = 5;
    const CLICK_WINDOW_MS = 1500;
    const GLITCH_DURATION_MS = 480;
    const TOAST_VISIBLE_MS = 2800;

    let clickCount = 0;
    let resetTimer = null;
    let toastTimer = null;

    function triggerEasterEgg() {
      bodyEl.classList.add('glitch-active');
      cardEl.classList.add('glitch-active');
      avatarEl.classList.add('glitch-active');

      setTimeout(() => {
        bodyEl.classList.remove('glitch-active');
        cardEl.classList.remove('glitch-active');
        avatarEl.classList.remove('glitch-active');
      }, GLITCH_DURATION_MS);

      if (navigator.vibrate) {
        navigator.vibrate([200, 100, 200]);
      }

      clearTimeout(toastTimer);
      toastEl.classList.add('show');
      toastTimer = setTimeout(() => {
        toastEl.classList.remove('show');
      }, TOAST_VISIBLE_MS);
    }

    avatarEl.addEventListener('click', () => {
      clearTimeout(resetTimer);
      clickCount++;

      if (clickCount >= CLICKS_NEEDED) {
        clickCount = 0;
        triggerEasterEgg();
        return;
      }

      resetTimer = setTimeout(() => {
        clickCount = 0;
      }, CLICK_WINDOW_MS);
    });
  })();
</script>

</body>
</html>
