<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MalditoTucu</title>
<style>
  :root {
    --glass-bg: rgba(255, 255, 255, 0.08);
    --glass-border: rgba(255, 255, 255, 0.18);
    --text-color: #f5f5f5;
    --accent: #ffffff;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  html, body {
    height: 100%;
    width: 100%;
    overflow-x: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    color: var(--text-color);
  }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Video de fondo */
  .bg-video {
    position: fixed;
    top: 50%;
    left: 50%;
    min-width: 100%;
    min-height: 100%;
    width: auto;
    height: auto;
    transform: translate(-50%, -50%);
    z-index: -2;
    object-fit: cover;
  }

  .bg-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0, 0, 0, 0.55);
    z-index: -1;
  }

  /* Card glassmorphism */
  .card {
    width: 90%;
    max-width: 420px;
    padding: 44px 32px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 24px;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.37);
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: fadeIn 2.2s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .avatar {
    width: 110px;
    height: 110px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(255, 255, 255, 0.6);
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    background: rgba(255, 255, 255, 0.1);
  }

  .name {
    margin-top: 18px;
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: 0.5px;
  }

  .location {
    margin-top: 6px;
    font-size: 0.9rem;
    opacity: 0.75;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .bio {
    margin-top: 18px;
    font-size: 0.95rem;
    line-height: 1.5;
    min-height: 3.2em;
    opacity: 0.9;
  }

  .bio .cursor-blink {
    display: inline-block;
    width: 2px;
    background: var(--accent);
    margin-left: 2px;
    animation: blink 0.9s steps(1) infinite;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .socials {
    margin-top: 26px;
    display: flex;
    gap: 16px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .socials a {
    width: 46px;
    height: 46px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.15);
    text-decoration: none;
    font-size: 1.3rem;
    transition: transform 0.25s ease, background 0.25s ease;
  }

  .socials a:hover {
    transform: translateY(-4px) scale(1.08);
    background: rgba(255, 255, 255, 0.22);
    box-shadow: 0 6px 18px rgba(255, 255, 255, 0.25);
  }

  .socials a img {
    width: 24px;
    height: 24px;
    object-fit: contain;
  }

  .socials a:hover img {
    animation: iconWiggle 0.5s ease;
  }

  @keyframes iconWiggle {
    0% { transform: rotate(0deg) scale(1); }
    25% { transform: rotate(-15deg) scale(1.15); }
    50% { transform: rotate(12deg) scale(1.15); }
    75% { transform: rotate(-6deg) scale(1.1); }
    100% { transform: rotate(0deg) scale(1.1); }
  }

  /* Control de música (mute + volumen) */
  .music-control {
    position: fixed;
    top: 24px;
    left: 24px;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 14px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 30px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    z-index: 10;
  }

  .music-toggle {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: transparent;
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.3rem;
    color: var(--text-color);
    z-index: 10;
    transition: transform 0.2s ease;
  }

  .music-toggle:hover {
    transform: scale(1.1);
  }

  .volume-slider {
    width: 90px;
    accent-color: #ffffff;
  }

  @media (max-width: 480px) {
    .volume-slider {
      width: 60px;
    }
  }

  .watermark {
    position: fixed;
    bottom: 12px;
    left: 50%;
    transform: translateX(-50%);
    width: 90%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    text-align: center;
    z-index: 5;
    pointer-events: none;
  }

  .watermark-brand {
    font-size: 13px;
    font-weight: 600;
    color: #3ddc84;
    opacity: 0.55;
  }

  .watermark-msg {
    font-size: 11px;
    font-weight: 400;
    color: #f5f5f5;
    opacity: 0.3;
  }

</style>
</head>
<body>

  <video class="bg-video" autoplay muted loop playsinline>
    <source src="fondo.mp4" type="video/mp4">
  </video>
  <div class="bg-overlay"></div>

  <div class="card">
    <img class="avatar" src="avatar.png" alt="Avatar" onerror="this.style.opacity=0.2;">
    <div class="name">MalditoTucumano</div>
    <div class="location">Tucumán, Argentina</div>
    <div class="bio" id="bio"><span id="bio-text"></span><span class="cursor-blink">&nbsp;</span></div>

    <div class="socials">
      <a href="https://www.instagram.com/brianuvu/" target="_blank" rel="noopener noreferrer" title="@brianuvu"><img src="logos/instagram.png" alt="Instagram"></a>
      <a href="https://www.tiktok.com/@maldito_tucuman0" target="_blank" rel="noopener noreferrer" title="@maldito_tucuman0"><img src="logos/tik-tok.png" alt="TikTok"></a>
      <a href="discord://discordapp.com/users/486374139876081665" target="_blank" rel="noopener noreferrer" title="brians_uvu"><img src="logos/discord.png" alt="Discord"></a>
      <a href="https://kick.com/maldito-tucumano" target="_blank" rel="noopener noreferrer" title="Maldito_Tucumano"><img src="logos/kick.png" alt="Kick"></a>
    </div>
  </div>

  <div class="music-control">
    <button class="music-toggle" id="musicToggle" title="Activar/Desactivar música">🔇</button>
    <input type="range" id="volumeSlider" class="volume-slider" min="0" max="1" step="0.01" value="0.5">
  </div>
  <audio id="bgMusic" src="musica.mp3" loop></audio>

  <div class="watermark">
    <div class="watermark-brand">by MalditoTucumano</div>
    <div class="watermark-msg">si quieres algo como esto escribeme a cualquiera de mis redes y llegamos a un acuerdo</div>
  </div>

<script>
  // Efecto de tipeo en la bio
  const bioLines = [
    "Bienvenido, gracias por pasar",
    "Intento de streamer",
    "eh uraaaaa",
    "sigueme en mis redes"
  ];
  const bioText = document.getElementById('bio-text');
  let lineIndex = 0;
  let charIndex = 0;
  let deleting = false;

  function typeLoop() {
    const currentLine = bioLines[lineIndex];

    if (!deleting) {
      bioText.textContent = currentLine.slice(0, charIndex + 1);
      charIndex++;
      if (charIndex === currentLine.length) {
        deleting = true;
        setTimeout(typeLoop, 1800);
        return;
      }
    } else {
      bioText.textContent = currentLine.slice(0, charIndex - 1);
      charIndex--;
      if (charIndex === 0) {
        deleting = false;
        lineIndex = (lineIndex + 1) % bioLines.length;
      }
    }

    setTimeout(typeLoop, deleting ? 35 : 60);
  }
  typeLoop();

  // Música de fondo: toggle de mute + slider de volumen en tiempo real
  const musicToggle = document.getElementById('musicToggle');
  const volumeSlider = document.getElementById('volumeSlider');
  const bgMusic = document.getElementById('bgMusic');
  bgMusic.volume = parseFloat(volumeSlider.value);

  function updateMusicIcon() {
    musicToggle.textContent = (bgMusic.paused || bgMusic.muted) ? '🔇' : '🔊';
  }

  musicToggle.addEventListener('click', () => {
    if (bgMusic.paused) {
      bgMusic.muted = false;
      bgMusic.play().catch(() => {});
    } else {
      bgMusic.muted = !bgMusic.muted;
    }
    updateMusicIcon();
  });

  volumeSlider.addEventListener('input', () => {
    const vol = parseFloat(volumeSlider.value);
    bgMusic.volume = vol;
    bgMusic.muted = vol === 0;
    if (bgMusic.paused && vol > 0) {
      bgMusic.play().catch(() => {});
    }
    updateMusicIcon();
  });

  // Intento de autoplay al entrar. Si el navegador lo bloquea, arranca
  // apenas el usuario interactúa por primera vez con la página.
  function tryAutoplay() {
    bgMusic.play().then(updateMusicIcon).catch(() => {
      const startOnInteraction = () => {
        bgMusic.play().catch(() => {});
        updateMusicIcon();
      };
      ['click', 'touchstart', 'keydown'].forEach(evt =>
        document.addEventListener(evt, startOnInteraction, { once: true })
      );
    });
  }
  tryAutoplay();
</script>

</body>
</html>
